; =============================================================================
; Chaos Piano — PlatformIO Multi-Environment Configuration
; =============================================================================
; Two RP2040-Zero brains, one project. Shared protocol library ensures
; I2C message formats stay in sync across both firmware targets.
;
; Build commands:
;   pio run -e brain1_controller    # compile Brain 1 only
;   pio run -e brain2_audio         # compile Brain 2 only
;   pio run -e brain1_controller -t upload
;   pio run -e brain2_audio -t upload
;
; IMPORTANT: When uploading, only ONE RP2040 should be connected via USB
; at a time, or you must specify the upload_port manually.
; =============================================================================

[platformio]
; Default builds both. Use -e flag to target one.
default_envs = brain1_controller, brain2_audio

; =============================================================================
; Shared settings for both RP2040-Zero boards
; =============================================================================
[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2040_zero
framework = arduino

; Use the Earle Philhower Arduino-Pico core (not the mbed one).
; This core gives us proper I2S support, multi-core, and PIO.
board_build.core = earlephilhower

; Common build flags for both brains
build_flags =
    -DCHAOS_PIANO                  ; Global project identifier
    -DPICO_FLASH_SIZE_BYTES=2097152 ; 2MB flash on RP2040-Zero
    -Wall                          ; Enable all compiler warnings
    -Wextra                        ; Extra warnings catch real bugs

; Shared library — the I2C protocol definitions
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0

; Serial monitor speed
monitor_speed = 115200

; =============================================================================
; Brain 1: Physical Controller
; Manages ultrasonics, motors, LEDs. I2C Controller role.
; =============================================================================
[env:brain1_controller]
build_src_filter =
    +<brain1_controller/>

; Persistent upload port — uses the RP2040's unique hardware serial number.
; This symlink is created automatically by Linux udev, so it works regardless
; of which USB port the board is plugged into or the order of connection.
upload_port = /dev/serial/by-id/usb-Waveshare_RP2040_Zero_E66428C51F4BB630-if00
monitor_port = /dev/serial/by-id/usb-Waveshare_RP2040_Zero_E66428C51F4BB630-if00

build_flags =
    ${env.build_flags}
    -DBRAIN1_CONTROLLER             ; Firmware identity flag
    -DI2C_TARGET_ADDR=0x42          ; Brain 2's I2C address

; =============================================================================
; Brain 2: Audio Engine
; Manages piezos, DSP effects, DFPlayer, I2S output. I2C Target role.
; =============================================================================
[env:brain2_audio]
build_src_filter =
    +<brain2_audio/>

upload_port = /dev/serial/by-id/usb-Waveshare_RP2040_Zero_E66428C51F63B530-if00
monitor_port = /dev/serial/by-id/usb-Waveshare_RP2040_Zero_E66428C51F63B530-if00

build_flags =
    ${env.build_flags}
    -DBRAIN2_AUDIO                  ; Firmware identity flag
    -DI2C_OWN_ADDR=0x42            ; This brain's I2C address
    -DSAMPLE_RATE=22050             ; Audio sample rate in Hz
    -DADC_BITS=12                   ; RP2040 ADC resolution
